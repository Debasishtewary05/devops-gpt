AWSTemplateFormatVersion: '2010-09-09'
Description: DevOpsGPT DynamoDB Tables

Resources:

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: alerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alertId
          AttributeType: S
      KeySchema:
        - AttributeName: alertId
          KeyType: HASH

  ServersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: servers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serverId
          AttributeType: S
      KeySchema:
        - AttributeName: serverId
          KeyType: HASH

  LogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: logs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: logId
          AttributeType: S
      KeySchema:
        - AttributeName: logId
          KeyType: HASH